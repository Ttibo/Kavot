[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kavot"
version = "0.1.0"
description = "Local-first research workspace: articles, notes, canvases and tasks in one desktop app"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30,<3",
    "httpx>=0.27,<1",
    "keyring>=25,<27",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "Pillow>=11.0.0,<13.0.0",
    "pdfplumber>=0.11.9,<0.12.0",
    "markdownify>=1.2.0,<2.0.0",
    "markdown-it-py>=4,<5",
    "mdit-py-plugins>=0.6,<1",
    "beautifulsoup4>=4.12,<5",
    "bleach[css]>=6.4,<7",
    "latex2mathml>=3.81,<4",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.urls]
Homepage = "https://kavot.cloud"
Source = "https://github.com/Ttibo/Kavot"
Issues = "https://github.com/Ttibo/Kavot/issues"

[project.optional-dependencies]
desktop = ["pywebview>=6.0,<7.0"]
build = ["pyinstaller>=6.0.0,<7.0.0"]
# Local embeddings for the semantic stage of search (enable it in the preferences).
semantic = ["fastembed>=0.4,<1"]
dev = ["pytest>=8"]

[project.scripts]
kavot = "desktop:main"

[tool.setuptools]
py-modules = ["desktop"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.setuptools.package-data]
app = ["resources/*.json", "resources/*.js", "plugins/*/plugin.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
